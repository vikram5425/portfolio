# ==========================================
# Vikram Portfolio - Application Properties
# ==========================================

# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration (via Voroa DATABASE_URL)
# The datasource URL, username, and password are set programmatically
# by DataSourceConfig.java which parses the DATABASE_URL environment variable.
# This handles the postgres:// → jdbc:postgresql:// conversion automatically.

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Database initialization - disabled to prevent overwriting admin-managed data.
# Seed data should be loaded once manually or via a one-time migration.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
